# build.yml: tests and installers for Windows and macOS (SPEC 10).
# Runs only on pull requests and by hand, never on every push: the private
# repo's Actions minutes are limited and macOS minutes count 10x (Zoltan,
# 2026-09-30).
name: build

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # the design canon is read at build time and baked into the app
      DESIGN_SYSTEM_DIR: ${{ github.workspace }}/design-system
    steps:
      - uses: actions/checkout@v4

      # Private repo: a read-only fine-grained token, only for design-system.
      - uses: actions/checkout@v4
        with:
          repository: YogiZoli/design-system
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: design-system

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Runner tests
        run: npm test

      - name: App dependencies
        working-directory: app
        run: npm ci

      - name: UI check
        working-directory: app
        run: npm run check

      - name: Node sidecar (pinned, SHA256 checked)
        run: node scripts/fetch-sidecars.mjs

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Installer
        working-directory: app
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
