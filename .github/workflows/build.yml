# build.yml: tests and installers for Windows and macOS (SPEC 10).
# Runs only on pull requests and by hand, never on every push: the private
# repo's Actions minutes are limited and macOS minutes count 10x (Zoltan,
# 2026-09-30). While a phase is in development, pull requests build Windows
# only; macOS is built by hand (gh workflow run build -f platforms=both) on the
# version Zoltan approved.
name: build

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        options: [windows, macos, both]
        default: both

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          (github.event_name != 'workflow_dispatch' || inputs.platforms == 'windows') && '[{"os":"windows-latest","bundles":"nsis"}]' ||
          inputs.platforms == 'macos' && '[{"os":"macos-latest","bundles":"dmg"}]' ||
          '[{"os":"windows-latest","bundles":"nsis"},{"os":"macos-latest","bundles":"dmg"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # the design-system tokens (the app UI look, DECISIONS 39) are read at build time
      DESIGN_SYSTEM_DIR: ${{ github.workspace }}/design-system
    steps:
      - uses: actions/checkout@v4

      # Private repo: a read-only fine-grained token, only for design-system.
      - uses: actions/checkout@v4
        with:
          repository: YogiZoli/design-system
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: design-system

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Runner dependencies (the Anthropic SDK, pinned by runner/package-lock.json)
        run: npm ci --prefix runner --no-audit --no-fund

      - name: Runner tests
        run: npm test

      - name: App dependencies
        working-directory: app
        run: npm ci

      - name: UI check
        working-directory: app
        run: npm run check

      - name: Node and ffmpeg sidecars (pinned, SHA256 checked)
        run: node scripts/fetch-sidecars.mjs

      - name: ffmpeg can do what the pipeline needs
        run: node scripts/check-ffmpeg.mjs

      - name: Render engine (HyperFrames, GSAP, pinned by engine/package-lock.json)
        run: node scripts/fetch-engine.mjs

      - name: Scene library (HyperFrames registry components, pinned and SHA256 checked)
        run: node scripts/fetch-library.mjs

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Installer
        working-directory: app
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
